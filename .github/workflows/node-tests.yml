name: Node tests

on:
  workflow_dispatch:
  push:
    paths:
      - ".dockerignore"
      - ".nvmrc"
      - "SECURITY.md"
      - "SECURITY.zh-CN.md"
      - "CHANGELOG.md"
      - "CHANGELOG.zh-CN.md"
      - "VERSION"
      - "GOVERNANCE.md"
      - "GOVERNANCE.zh-CN.md"
      - "package.json"
      - "containers/**"
      - "packages/**"
      - "sdk/**"
      - "specs/contributor/**"
      - "specs/connectors/**"
      - "specs/registry/**"
      - "specs/release/**"
      - "specs/governance/**"
      - "governance/**"
      - "docs/contributor/**"
      - "examples/connectors/**"
      - "examples/registry/**"
      - "registry/**"
      - "docs/registry/**"
      - "docs/release/**"
      - "scripts/create-public-release.mjs"
      - "scripts/validate-registry-contribution.mjs"
      - "scripts/verify-registry-history.mjs"
      - "scripts/offline-network-guard.mjs"
      - "scripts/run-contributor-tests.mjs"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.zh-CN.md"
      - "tests/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/ISSUE_TEMPLATE/external-role-nomination.yml"
      - ".github/PULL_REQUEST_TEMPLATE/registry-contribution.md"
      - ".github/workflows/registry-preflight.yml"
      - ".github/workflows/node-tests.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - ".nvmrc"
      - "SECURITY.md"
      - "SECURITY.zh-CN.md"
      - "CHANGELOG.md"
      - "CHANGELOG.zh-CN.md"
      - "VERSION"
      - "GOVERNANCE.md"
      - "GOVERNANCE.zh-CN.md"
      - "package.json"
      - "containers/**"
      - "packages/**"
      - "sdk/**"
      - "specs/contributor/**"
      - "specs/connectors/**"
      - "specs/registry/**"
      - "specs/release/**"
      - "specs/governance/**"
      - "governance/**"
      - "docs/contributor/**"
      - "examples/connectors/**"
      - "examples/registry/**"
      - "registry/**"
      - "docs/registry/**"
      - "docs/release/**"
      - "scripts/create-public-release.mjs"
      - "scripts/validate-registry-contribution.mjs"
      - "scripts/verify-registry-history.mjs"
      - "scripts/offline-network-guard.mjs"
      - "scripts/run-contributor-tests.mjs"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.zh-CN.md"
      - "tests/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/config.yml"
      - ".github/ISSUE_TEMPLATE/external-role-nomination.yml"
      - ".github/PULL_REQUEST_TEMPLATE/registry-contribution.md"
      - ".github/workflows/registry-preflight.yml"
      - ".github/workflows/node-tests.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run contributor contracts and synthetic scenarios
        run: node scripts/run-contributor-tests.mjs --profile all
      - name: Build contributor test container
        run: docker build --file containers/contributor/Dockerfile --tag ct-aicomm-contributor:test .
      - name: Run contributor container without network or writable root
        run: docker run --rm --network none --read-only --tmpfs /tmp ct-aicomm-contributor:test --profile all
      - name: Run complete test suite
        run: node scripts/run-contributor-tests.mjs --profile full
