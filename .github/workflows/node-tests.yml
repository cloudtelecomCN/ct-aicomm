name: Node tests

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/**"
      - "sdk/**"
      - "specs/connectors/**"
      - "specs/registry/**"
      - "examples/connectors/**"
      - "examples/registry/**"
      - "registry/**"
      - "docs/registry/**"
      - "scripts/validate-registry-contribution.mjs"
      - "CONTRIBUTING.md"
      - "tests/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE/registry-contribution.md"
      - ".github/workflows/registry-preflight.yml"
      - ".github/workflows/node-tests.yml"
  pull_request:
    paths:
      - "packages/**"
      - "sdk/**"
      - "specs/connectors/**"
      - "specs/registry/**"
      - "examples/connectors/**"
      - "examples/registry/**"
      - "registry/**"
      - "docs/registry/**"
      - "scripts/validate-registry-contribution.mjs"
      - "CONTRIBUTING.md"
      - "tests/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE/registry-contribution.md"
      - ".github/workflows/registry-preflight.yml"
      - ".github/workflows/node-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run complete test suite
        run: node --test "tests/*.test.mjs"
