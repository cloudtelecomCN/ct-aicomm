name: Signed public release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require the tag to match VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - name: Validate the public release boundary
        run: node scripts/validate-open-source-release-manifest.mjs
      - name: Run contributor contracts and synthetic scenarios
        run: npm test
      - name: Run the complete public test suite
        run: npm run test:full
      - name: Build deterministic release artifacts
        shell: bash
        env:
          CT_RELEASE_OUTPUT_ROOT: ${{ runner.temp }}
        run: node scripts/create-public-release.mjs --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/ct-aicomm-release"
      - name: Verify generated checksums
        shell: bash
        run: cd "$RUNNER_TEMP/ct-aicomm-release" && sha256sum --check SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the checksum manifest with GitHub OIDC
        shell: bash
        run: cosign sign-blob --yes --bundle "$RUNNER_TEMP/ct-aicomm-release/SHA256SUMS.sigstore.json" "$RUNNER_TEMP/ct-aicomm-release/SHA256SUMS"
      - name: Verify the Sigstore identity before publication
        shell: bash
        run: |
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/ct-aicomm-release/SHA256SUMS.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/ct-aicomm-release/SHA256SUMS"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ct-aicomm-release/*
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/ct-aicomm-release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/ct-aicomm-$GITHUB_REF_NAME-source.tar.gz" \
            "$RELEASE_DIR/ct-aicomm-$GITHUB_REF_NAME.spdx.json" \
            "$RELEASE_DIR/release-manifest-$GITHUB_REF_NAME.json" \
            "$RELEASE_DIR/SHA256SUMS" \
            "$RELEASE_DIR/SHA256SUMS.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CT-AIComm $GITHUB_REF_NAME" \
            --notes-file "$RELEASE_DIR/RELEASE_NOTES.md" \
            --verify-tag \
            --prerelease
